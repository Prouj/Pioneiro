<header class="hd">
  <div class="hd-container">
    <a href="../Home/home.html" class="hd-logo">
      <img src="../Images/Logo.png" alt="O Pioneiro do Mondego">
      <h2 class="hd-brand"  data-i18n-html="header.brand"></h2>
    </a>

    <nav class="hd-nav" role="navigation" aria-label="Principal">
      <a class="hd-link" href="../Home/home.html" aria-current="page" data-i18n="nav.home"></a>
      <a class="hd-link" href="../Book/book.html" aria-current="page" data-i18n="nav.booking"></a>

    <!-- Dropdown de idioma (desktop) -->
    <div class="hd-langdrop" data-role="langdrop">
      <button class="hd-langdrop-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langmenu-desktop">
        <span class="hd-lang-current" data-current-flag></span>
        <span class="hd-lang-code" data-current-code></span>
        <svg class="hd-chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
      <ul class="hd-langmenu" id="langmenu-desktop" role="listbox" tabindex="-1" hidden>
        <li role="option"><button type="button" class="hd-langopt" data-lang="pt-PT" data-flag="🇵🇹" data-label="PT">PT <span>🇵🇹</span></button></li>
        <li role="option"><button type="button" class="hd-langopt" data-lang="en-GB" data-flag="🇬🇧" data-label="EN">EN <span>🇬🇧</span></button></li>
        <li role="option"><button type="button" class="hd-langopt" data-lang="es-ES" data-flag="🇪🇸" data-label="ES">ES <span>🇪🇸</span></button></li>
        <li role="option"><button type="button" class="hd-langopt" data-lang="fr-FR" data-flag="🇫🇷" data-label="FR">FR <span>🇫🇷</span></button></li>
        <li role="option"><button type="button" class="hd-langopt" data-lang="nl-NL" data-flag="🇳🇱" data-label="NL">NL <span>🇳🇱</span></button></li>
      </ul>
    </div>

    <!-- Toggle mobile: apenas emite evento -->
    <button class="icon-btn hd-toggle" type="button" aria-label="Abrir menu">
      <img src="../Images/MenuIcon.png" width="24" height="24" alt="">
    </button>
