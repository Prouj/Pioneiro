<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Pioneiro do Mondego</title>
    <link rel="stylesheet" href="explore_styles.css">
    <script type="module" defer src="../Global/scripts.js"></script>
    <style>
        body {
            visibility: hidden
        }
    </style>
</head>

<body>
    <div id="site-header"></div>
    <div id="site-drawer"></div>

    <main>
        <section id="explore">
            <image-banner src="../Images/ExploreImage.png" alt="Pessoas no caiaque" title="explore.third_section_bannerOne_title"></image-banner>
        </section>

        <section class="explore_intro">
            <h1 class="text_title" data-i18n="explore.title">Explore a Região</h1>
            <p class="text_body" data-i18n="explore.description">
                Queres fazer um fim de semana de turismo de aventura outdoor e natureza no Centro de Portugal? 
                Estás à procura de actividade para combinar com a descida e lugar onde ficar?
            </p>
        </section>

        <div class="explore_content">
            <!-- As categorias serão carregadas dinamicamente aqui -->
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.visibility = 'visible'; }, 100);
        });
    </script>
    <script type="module" src="./explore-script.js"></script>
</body>

</html>
