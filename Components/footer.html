<footer class="contact-footer" id="contato">
  <div class="cf-container">
    <h2 class="cf-title" data-i18n="footer.form_title"></h2>

    <div class="cf-grid">
      <!-- FORMULÁRIO -->
      <form name="contact" netlify method="POST" class="cf-form" id="form" autocomplete="on"  novalidate>
        <div class="cf-form-left">
          <div class="cf-field">
            <label for="cf-nome" data-i18n="footer.form_name"></label>
            <input id="cf-nome" name="name" type="text" data-i18n="footer.form_name_placeholder" data-i18n-attr="placeholder" required>
          </div>

          <div class="cf-field">
            <label for="cf-email" data-i18n="footer.form_email"></label>
            <input id="cf-email" name="email" type="email" data-i18n="footer.form_email_placeholder" data-i18n-attr="placeholder" required>
          </div>

          <div class="cf-field">
            <label for="cf-tel" data-i18n="footer.form_phone"></label>
            <input id="cf-tel" name="phone" type="tel" data-i18n="footer.form_phone_placeholder" data-i18n-attr="placeholder">
          </div>
        </div>

        <div class="cf-form-right">
          <div class="cf-field">
            <label for="cf-msg" data-i18n="footer.form_message"></label>
            <textarea id="cf-msg" name="message" rows="7" data-i18n="footer.form_message_placeholder" data-i18n-attr="placeholder"></textarea>
          </div>

          <button class="cf-btn" type="submit" data-i18n-attr="aria-label" data-i18n-aria-label="footer.form_send_aria" data-i18n="footer.form_send_button"></button>
        </div>
      </form>

      <!-- INFORMAÇÕES DA EMPRESA -->
      <aside class="cf-info">
        <h3 class="cf-brand" data-i18n="footer.company_name"></h3>

        <address class="cf-address" data-i18n-html="footer.address"></address>

        <p class="cf-contacts" data-i18n-html="footer.contacts"></p>

        <p class="cf-small" data-i18n-html="footer.license"></p>

        <div class="cf-socials" data-i18n-attr="aria-label" data-i18n-aria-label="footer.social_networks_aria">
          <!-- Google -->
          <a href="https://share.google/EMCMZYnlxDqWDmPZp" data-i18n-attr="aria-label" data-i18n-aria-label="footer.google_aria" class="cf-social">
            <img src="../Images/GoogleIcon.png" viewBox="0 0 24 24" width="22" aria-hidden="true"></img>
          </a>
          <!-- TripAdvisor (coruja simplificada) -->
          <a href="https://www.tripadvisor.com.br/Attraction_Review-g189143-d3189278-Reviews-O_Pioneiro_do_Mondego-Coimbra_Coimbra_District_Central_Portugal.html" data-i18n-attr="aria-label" data-i18n-aria-label="footer.tripadvisor_aria" class="cf-social">
            <img src="../Images/TripAdvisorIcon.png" viewBox="0 0 24 24" width="22" height="22"
              aria-hidden="true"></img>
          </a>
          <!-- Facebook -->
          <a href="https://www.facebook.com/kayakmondego/" data-i18n-attr="aria-label" data-i18n-aria-label="footer.facebook_aria" class="cf-social">
            <img src="../Images/FacebookIcon.png" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"></img>
          </a>
          <a href="https://www.livroreclamacoes.pt/Inicio/" target="_blank" rel="noopener noreferrer" data-i18n-attr="aria-label" data-i18n-aria-label="footer.complaintsbook_aria" class="cf-badge">
            <img src="../Images/Complaintsbook.png" aria-hidden="true"></img>
          </a>
        </div>

        <!-- <div class="cf-badges">
          
        </div> -->
      </aside>
    </div>
  </div>
</footer>
