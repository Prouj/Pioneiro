<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Pioneiro do Mondego</title>
    <link rel="stylesheet" href="home_styles.css">
    <link rel="stylesheet" href="../Components/ComponentsCss/imageCard.css">
    <script type="module" defer src="../Global/scripts.js"></script>
    <style>
        body {
            visibility: hidden
        }
    </style>
</head>

<body>

    <div id="site-header"></div>
    <div id="site-drawer"></div>

    <main>
        <div class="first_section">
            <img src="../Images/HomeImage.png" alt="homeImage">
            <div class="first_section_content">
                <h2 data-i18n-html="home.first_section_title"></h2>
                <div class="buttons">
                    <a class="book" href="../Book/book.html" data-i18n="home.first_section_schedule_button"></a>
                    <button class="feedbacks" data-i18n="home.first_section_feedback_button"></button>
                </div>
            </div>
        </div>

        <div class="second_section">
            <div class="second_section_text">
                <h2 class="text_title" data-i18n="home.second_section_first_title"></h2>
                <p class="text_body" data-i18n="home.second_section_first_text"></p>
                <div class="second_section_subtext">
                    <h2 class="text_title" data-i18n="home.second_section_second_title"></h2>
                    <p class="text_body" data-i18n="home.second_section_second_text"></p>
                </div>

            </div>
            <div class="second_section_images">
                <img src="../Images/HomeSecondSectionImage1.png" alt="Imagem" class="image-card-img1">
                <img src="../Images/HomeSecondSectionImage2.png" alt="Imagem" class="image-card-img2">
            </div>
        </div>

        <div class="third_section">
            <image-banner src="../Images/BannerHomeImage.png" alt="Pessoas no caiaque"
                title="home.third_section_bannerOne_title"></image-banner>

            <div class="third_section_cards">
                <image-card src="../Images/CardExperience.jpg" title="home.third_section_cardOne_title" subtitle="home.third_section_cardOne_text"></image-card>
                <image-card src="../Images/CardCalendar.jpg" title="home.third_section_cardTwo_title" subtitle="home.third_section_cardTwo_text"></image-card>
                <image-card src="../Images/CardSecurity.jpg" title="home.third_section_cardThree_title" subtitle="home.third_section_cardThree_text"></image-card>
            </div>

            <image-banner src="../Images/PeopleImage.png" alt="Pessoa no caiaque"
                title="home.third_section_bannerTwo_title"></image-banner>

            <a class="book" href="../Book/book.html" data-i18n="home.first_section_schedule_button"></a>
        </div>
    </main>

    <div id="site-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.visibility = 'visible'; }, 100);
        });
    </script>
</body>

</html>
