<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Pioneiro do Mondego</title>
    <link rel="stylesheet" href="gallery_styles.css">
    <script type="module" defer src="../Global/scripts.js"></script>
    <style>
        body {
            visibility: hidden
        }
    </style>
</head>

<body>
    <div id="site-header"></div>
    <div id="site-drawer"></div>

    <main>
        <section id="book">
            <image-banner src="../Images/PeopleImage.png" alt="Pessoas no caiaque" title="gallery.third_section_bannerOne_title"></image-banner>
        </section>

        <section class="gallery_content">
            <div class="gallery_intro">
                <h2 class="text_title" data-i18n="gallery.title"></h2>
                <p class="text_body" data-i18n-html="gallery.description"></p>
            </div>

            <div class="gallery_media_container">
                <div class="carousel_wrapper">
                    <div class="carousel_container">
                        <button class="carousel_btn carousel_btn_prev" data-i18n-attr="aria-label" data-i18n-aria-label="gallery.carousel_prev_label">‹</button>
                        <div class="carousel_track_container">
                            <div class="carousel_track"></div>
                        </div>
                        <button class="carousel_btn carousel_btn_next" data-i18n-attr="aria-label" data-i18n-aria-label="gallery.carousel_next_label">›</button>
                    </div>
                    <div class="carousel_dots"></div>
                </div>

                <div class="facebook_preview">
                    <iframe 
                        src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fkayakmondego&tabs=timeline&width=340&height=500&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true&appId"
                        width="340"
                        height="500"
                        style="border:none;overflow:hidden"
                        scrolling="no"
                        frameborder="0"
                        allowfullscreen="true"
                        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
                    </iframe>
                </div>
            </div>

            <div class="youtube_container">
                <h3 class="text_title" data-i18n="gallery.video_title"></h3>
                <div class="youtube_wrapper">
                    <iframe
                        src="https://www.youtube.com/embed/fiVEqICHqxQ"
                        title="O Pioneiro do Mondego - Vídeo"
                        frameborder="0"
                        width="100%"
                        height="100%"
                        allowfullscreen
                        allow="autoplay 'src'"
                        aria-label="External YouTube">
                    </iframe>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.body.style.visibility = 'visible'; }, 100);
        });
    </script>
    <script type="module" src="./gallery-carousel.js"></script>
</body>

</html>
